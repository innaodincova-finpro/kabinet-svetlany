name: Materialize report layout branch
on:
  push:
    branches: [fix/personal-rates]
    paths: [.github/workflows/materialize-report-layout.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify exact files
        run: |
          mkdir -p maintenance/safety/site
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:index.html > maintenance/safety/source/baseline.html
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:sw.js > maintenance/safety/site/sw.js
          python maintenance/safety/source/build.py
          cp maintenance/safety/site/index.html index.html
          cp maintenance/safety/site/sw.js sw.js
          echo "b8c9fcf008049024f84cc83d545334b06f5a4ad111a356ab7877940d26e09bc8  index.html" | sha256sum -c
          echo "7b58a8a3ef719ac32d3ac36d5dce81955aa3b2be65c9e90845029416d3e2cbe3  sw.js" | sha256sum -c
          bash maintenance/safety/check.sh
      - name: Save generated files to feature branch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Build formatted parent report and offline print view"
          git push origin HEAD:fix/personal-rates
