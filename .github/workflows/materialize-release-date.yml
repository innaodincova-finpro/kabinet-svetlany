name: Materialize release date fix
on:
  push:
    branches: [fix/release-date-18]
    paths: [.github/workflows/materialize-release-date.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify exact files
        run: |
          mkdir -p maintenance/safety/site
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:index.html > maintenance/safety/source/baseline.html
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:sw.js > maintenance/safety/site/sw.js
          python maintenance/safety/source/build.py
          cp maintenance/safety/site/index.html index.html
          cp maintenance/safety/site/sw.js sw.js
          echo "1342dfdc8da2075eb0922faadf6316e65d2c83a9789a4e06b547e071e537eedd  index.html" | sha256sum -c
          echo "6e6af4145a95c0b98bc0ebb14dff795c11a376720a23225ce019d9a951031e7c  sw.js" | sha256sum -c
          bash maintenance/safety/check.sh
      - name: Save generated files to feature branch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Correct release preparation date in both Help labels"
          git push origin HEAD:fix/release-date-18
