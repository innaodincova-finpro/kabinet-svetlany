name: Materialize reviewed personal rates files
on:
  push:
    branches: [fix/personal-rates]
    paths: [.github/workflows/materialize-rates.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact reviewed files and test
        run: |
          set -euo pipefail
          mkdir -p maintenance/safety/site
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:index.html > maintenance/safety/source/baseline.html
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:sw.js > maintenance/safety/site/sw.js
          python maintenance/safety/source/build.py
          cp maintenance/safety/site/index.html index.html
          cp maintenance/safety/site/sw.js sw.js
          echo 'b45b066971779c14d59abf6f1e169c39fe0a9406b5b041a53c2d745e8da362d2  index.html' | sha256sum -c -
          echo '7b58a8a3ef719ac32d3ac36d5dce81955aa3b2be65c9e90845029416d3e2cbe3  sw.js' | sha256sum -c -
          bash maintenance/safety/check.sh
      - name: Commit generated files to correction branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Build verified personal tariffs files'
          git push origin HEAD:refs/heads/fix/personal-rates
