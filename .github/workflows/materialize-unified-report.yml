name: Materialize unified report
on:
  push:
    branches: [fix/personal-rates]
    paths: [.github/workflows/materialize-unified-report.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed report sources
        run: |
          mkdir -p maintenance/safety/site
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:index.html > maintenance/safety/source/baseline.html
          git show d72c7d2e8ebab0573b3289c1f8bd726271dbe49d:sw.js > maintenance/safety/site/sw.js
          python maintenance/safety/source/build.py
          cp maintenance/safety/site/index.html index.html
          cp maintenance/safety/site/sw.js sw.js
          echo "df37907debe98c42d8205b46eabac29e01f7a3bfed52938c6cfffe5c3620b3d1  index.html" | sha256sum -c -
          bash maintenance/safety/check.sh
      - name: Save built files on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m "Build unified monthly report and explicit card linking"
          git push origin HEAD:fix/personal-rates
